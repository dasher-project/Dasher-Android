name: Release

# Builds a signed, directly-installable release APK and publishes it as a
# GitHub Release on version tags - the Android equivalent of Dasher-Windows'
# build-installer.yml release step.
#
# The APK is signed with the debug key (see app/build.gradle.kts) so it's
# sideloadable with no secrets in CI. For the Play Store, replace that with a
# real release keystore from secrets and produce an AAB instead.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (DasherCore + pugixml submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install NDK + CMake (versions pinned in app/build.gradle.kts)
        run: yes | sdkmanager "ndk;27.0.12077973" "cmake;3.22.1" || true

      # RFC 0022 item 7: inherit the engine changelog. Computes the DasherCore
      # commit range between the previous release's submodule pin and this
      # tag's, and appends it to the release body under "Engine changes" —
      # the hand-written versions of this section (v0.1.22/0.1.23) are now
      # generated. Skips gracefully on the first-ever release.
      - name: Engine changelog (old pin → new pin)
        run: |
          set -euo pipefail
          PREV_TAG=$(git tag --sort=-creatordate --merged origin/main | grep -v "^${GITHUB_REF_NAME}$" | head -1 || true)
          {
            if [ -n "$PREV_TAG" ]; then
              OLD_PIN=$(git rev-parse "$PREV_TAG:third_party/DasherCore" 2>/dev/null || echo "")
              NEW_PIN=$(git rev-parse "third_party/DasherCore")
              if [ -n "$OLD_PIN" ] && [ "$OLD_PIN" != "$NEW_PIN" ]; then
                (cd third_party/DasherCore && git fetch --quiet origin "$OLD_PIN" "$NEW_PIN" 2>/dev/null || git fetch --quiet --unshallow origin || true)
                echo "## Engine changes (DasherCore, ${PREV_TAG} → ${GITHUB_REF_NAME})"
                echo
                echo '```'
                git -C third_party/DasherCore log --oneline --no-decorate "$OLD_PIN..$NEW_PIN" | head -80
                echo '```'
              else
                echo "## Engine changes"
                echo
                echo "No engine pin change since ${PREV_TAG}."
              fi
            fi
          } > /tmp/engine-notes.md
          cat /tmp/engine-notes.md || true

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # The APK's versionName is git-derived (app/build.gradle.kts), so a
      # mismatch here means the checkout wasn't at the tag (workflow_dispatch
      # on a moving branch, or describe picked an older tag). Fail before the
      # release is published rather than ship a mislabelled APK.
      - name: Verify APK version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          aapt="$(ls $ANDROID_HOME/build-tools/*/aapt2 | sort -V | tail -1)"
          apk="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          apk_version="$("$aapt" dump badging "$apk" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          echo "tag: $tag   apk: $apk_version"
          if [ "$apk_version" != "$tag" ]; then
            echo "::error::APK versionName ($apk_version) does not match the tag being released (v$tag)"
            exit 1
          fi

      - name: Rename APK with tag
        run: |
          tag="${GITHUB_REF_NAME:-untagged}"
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/Dasher-Android-${tag}.apk"
          ls -l out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dasher-android-release-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          append_body: true
          body_path: /tmp/engine-notes.md
          files: out/*.apk
