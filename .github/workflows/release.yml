name: Release

# Builds a signed, directly-installable release APK and publishes it as a
# GitHub Release on version tags - the Android equivalent of Dasher-Windows'
# build-installer.yml release step.
#
# The APK is signed with the debug key (see app/build.gradle.kts) so it's
# sideloadable with no secrets in CI. For the Play Store, replace that with a
# real release keystore from secrets and produce an AAB instead.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (DasherCore + pugixml submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake (versions pinned in app/build.gradle.kts)
        run: sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # The APK's versionName is git-derived (app/build.gradle.kts), so a
      # mismatch here means the checkout wasn't at the tag (workflow_dispatch
      # on a moving branch, or describe picked an older tag). Fail before the
      # release is published rather than ship a mislabelled APK.
      - name: Verify APK version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          aapt="$(ls $ANDROID_HOME/build-tools/*/aapt2 | sort -V | tail -1)"
          apk="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          apk_version="$("$aapt" dump badging "$apk" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          echo "tag: $tag   apk: $apk_version"
          if [ "$apk_version" != "$tag" ]; then
            echo "::error::APK versionName ($apk_version) does not match the tag being released (v$tag)"
            exit 1
          fi

      - name: Rename APK with tag
        run: |
          tag="${GITHUB_REF_NAME:-untagged}"
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/Dasher-Android-${tag}.apk"
          ls -l out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dasher-android-release-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: out/*.apk
